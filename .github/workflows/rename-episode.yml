name: Rename episode
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "genkilad"
          git config user.email "genkilad@users.noreply.github.com"
          git mv "morning-bundle-31-october-2026-2026-10-30.mp3" "morning-2026-10-31.mp3"
          git commit -m "Rename morning-bundle-31-october-2026-2026-10-30.mp3 to morning-2026-10-31.mp3"
          git push
